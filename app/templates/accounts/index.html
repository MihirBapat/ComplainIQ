{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><div><p class="eyebrow">DBMS · CRUD</p><h1 class="h3">Account management</h1></div></div><form method="post" class="card card-body row g-2 mb-4"><div class="col-md"><select class="form-select" name="customer_id">{% for c in customers %}<option value="{{c.customer_id}}">{{c.full_name}}</option>{% endfor %}</select></div><div class="col-md"><select class="form-select" name="type_id">{% for t in types %}<option value="{{t.type_id}}">{{t.type_name}}</option>{% endfor %}</select></div><div class="col-md"><input class="form-control" name="account_number" placeholder="Account number" required></div><div class="col-md"><select class="form-select" name="status"><option>ACTIVE</option><option>FROZEN</option><option>CLOSED</option></select></div><div class="col-auto"><button class="btn btn-primary">Add account</button></div></form><div class="panel p-0 overflow-hidden"><div class="table-responsive"><table class="table table-darkish mb-0"><tr><th>NUMBER</th><th>CUSTOMER</th><th>TYPE</th><th>BALANCE</th><th>STATUS</th><th></th></tr>{% for a in accounts %}<tr><td>{{a.account_number}}</td><td>{{a.full_name}}</td><td>{{a.type_name}}</td><td>₹ {{'%.2f'|format(a.balance)}}</td><td>{{a.status}}</td><td class="text-end"><a class="btn btn-sm btn-outline-light" href="{{url_for('accounts.edit',account_id=a.account_id)}}">Edit</a> <form class="d-inline" method="post" action="{{url_for('accounts.delete',account_id=a.account_id)}}" onsubmit="return confirm('Delete this account and its linked transactions?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No accounts yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}
