{% extends 'base.html' %}{% block content %}<h1>Accounts</h1><form method="post" class="card card-body row g-2 mb-3"><div class="col"><select class="form-select" name="customer_id">{% for c in customers %}<option value="{{c.customer_id}}">{{c.full_name}}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="type_id">{% for t in types %}<option value="{{t.type_id}}">{{t.type_name}}</option>{% endfor %}</select></div><div class="col"><input class="form-control" name="account_number" placeholder="Account number" required></div><div class="col-auto"><button class="btn btn-primary">Add</button></div></form><table class="table bg-white"><tr><th>Number</th><th>Customer</th><th>Type</th><th>Balance</th><th>Status</th><th></th></tr>{% for a in accounts %}<tr><td>{{a.account_number}}</td><td>{{a.full_name}}</td><td>{{a.type_name}}</td><td>{{'%.2f'|format(a.balance)}}</td><td>{{a.status}}</td><td><form method="post" action="{{url_for('accounts.delete',account_id=a.account_id)}}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No accounts yet.</td></tr>{% endfor %}</table>{% endblock %}
