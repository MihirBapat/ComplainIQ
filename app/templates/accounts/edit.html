{% extends 'base.html' %}{% block content %}<div class="col-lg-7 mx-auto"><p class="eyebrow">DBMS · UPDATE</p><h1 class="h3 mb-3">Edit account</h1><form method="post" class="panel"><label class="form-label">Customer</label><select class="form-select mb-3" name="customer_id">{% for c in customers %}<option value="{{ c.customer_id }}" {% if c.customer_id == account.customer_id %}selected{% endif %}>{{ c.full_name }}</option>{% endfor %}</select><label class="form-label">Account type</label><select class="form-select mb-3" name="type_id">{% for t in types %}<option value="{{ t.type_id }}" {% if t.type_id == account.type_id %}selected{% endif %}>{{ t.type_name }}</option>{% endfor %}</select><label class="form-label">Account number</label><input class="form-control mb-3" name="account_number" value="{{ account.account_number }}" required><label class="form-label">Status</label><select class="form-select mb-4" name="status">{% for status in ['ACTIVE','FROZEN','CLOSED'] %}<option {% if status == account.status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-light" href="{{ url_for('accounts.index') }}">Cancel</a></form></div>{% endblock %}
