{% extends 'base.html' %}{% block content %}<h1>Pending fraud flags</h1><table class="table bg-white"><tr><th>Reason</th><th>Severity</th><th>Customer</th><th>Amount</th><th></th></tr>{% for f in flags %}<tr><td>{{f.reason}}</td><td>{{f.severity}}</td><td>{{f.customer_name}}</td><td>{{f.amount}}</td><td><form class="d-inline" method="post" action="{{url_for('fraud.review',flag_id=f.flag_id,status='CONFIRMED')}}"><button class="btn btn-success btn-sm">Confirm</button></form> <form class="d-inline" method="post" action="{{url_for('fraud.review',flag_id=f.flag_id,status='DISMISSED')}}"><button class="btn btn-outline-secondary btn-sm">Dismiss</button></form></td></tr>{% else %}<tr><td colspan="5">No pending flags.</td></tr>{% endfor %}</table>{% endblock %}
