{% extends 'base.html' %}{% block content %}<h1>Submit complaint</h1><form method="post" class="card card-body col-lg-8"><input class="form-control mb-2" name="email" type="email" placeholder="Registered email" required><input class="form-control mb-2" name="account_number" placeholder="Account number" required><input class="form-control mb-2" name="txn_id" type="number" placeholder="Optional transaction ID"><textarea class="form-control mb-3" name="complaint_text" rows="6" minlength="20" placeholder="Tell us what happened" required></textarea><button class="btn btn-primary">Submit</button></form>{% endblock %}
