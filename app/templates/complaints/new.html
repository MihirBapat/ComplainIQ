{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><p class="eyebrow">CUSTOMER PORTAL · AI TRIAGE</p><h1 class="h2">Tell us what happened</h1><p class="text-secondary">Your complaint is classified for the review team using text analysis, sentiment and an urgency score.</p><form method="post" class="panel mt-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Registered email</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label class="form-label">Account number</label><input class="form-control" name="account_number" required></div><div class="col-12"><label class="form-label">Transaction ID <span class="text-secondary">(optional)</span></label><input class="form-control" name="txn_id" type="number" min="1" placeholder="For example, 1042"></div><div class="col-12"><label class="form-label">Complaint details</label><textarea class="form-control" name="complaint_text" rows="7" minlength="20" placeholder="Describe the transaction or service problem in at least 20 characters." required></textarea></div></div><button class="btn btn-primary mt-4">Submit for classification</button></form></div></div>{% endblock %}
