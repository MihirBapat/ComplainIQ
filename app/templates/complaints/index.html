{% extends 'base.html' %}{% block content %}<h1>Complaints</h1><table class="table bg-white"><tr><th>ID</th><th>Customer</th><th>Category</th><th>Urgency</th><th>Status</th></tr>{% for c in complaints %}<tr><td><a href="{{url_for('complaints.detail',complaint_id=c.complaint_id)}}">{{c.complaint_id}}</a></td><td>{{c.customer_name}}</td><td>{{c.category_name}}</td><td>{{c.urgency}}</td><td>{{c.status}}</td></tr>{% endfor %}</table>{% endblock %}
