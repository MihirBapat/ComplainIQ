{% extends 'base.html' %}{% block content %}<h1>Complaint #{{complaint.complaint_id}}</h1><p>{{complaint.complaint_text}}</p><form method="post" class="card card-body"><select class="form-select mb-2" name="status">{% for s in ['OPEN','IN_REVIEW','RESOLVED','REJECTED'] %}<option {% if complaint.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><select class="form-select mb-2" name="category_id">{% for c in categories %}<option value="{{c.category_id}}" {% if complaint.category_id==c.category_id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select><textarea class="form-control mb-2" name="note" placeholder="Note"></textarea><button class="btn btn-primary">Update</button></form><h2 class="h4 mt-3">Audit trail</h2>{% for a in actions %}<p>{{a.acted_at}} — {{a.action}}: {{a.note}}</p>{% endfor %}{% endblock %}
