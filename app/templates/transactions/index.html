{% extends 'base.html' %}{% block content %}<h1>Transactions</h1><form method="post" class="card card-body row g-2 mb-3"><div class="col"><select class="form-select" name="account_id">{% for a in accounts %}<option value="{{a.account_id}}">{{a.account_number}}</option>{% endfor %}</select></div><div class="col"><select class="form-select" name="txn_type"><option>DEBIT</option><option>CREDIT</option></select></div><div class="col"><input class="form-control" type="number" step="0.01" min="0.01" name="amount" placeholder="Amount" required></div><div class="col"><input class="form-control" name="merchant" placeholder="Merchant"></div><div class="col"><input class="form-control" name="location" placeholder="Location"></div><div class="col-auto"><button class="btn btn-primary">Add</button></div></form><div class="table-responsive"><table class="table bg-white"><tr><th>Time</th><th>Account</th><th>Type</th><th>Amount</th><th>Location</th><th>Status</th></tr>{% for t in transactions %}<tr><td>{{t.txn_time}}</td><td>{{t.account_number}}</td><td>{{t.txn_type}}</td><td>{{t.amount}}</td><td>{{t.location}}</td><td>{{t.status}}</td></tr>{% else %}<tr><td colspan="6">No transactions.</td></tr>{% endfor %}</table></div>{% endblock %}
