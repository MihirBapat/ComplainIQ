{% extends 'base.html' %}{% block content %}<h1>Edit customer</h1><form method="post" class="card card-body col-md-6"><input class="form-control mb-2" name="full_name" value="{{customer.full_name}}" required><input class="form-control mb-2" name="email" type="email" value="{{customer.email}}" required><input class="form-control mb-2" name="phone" value="{{customer.phone or ''}}"><input class="form-control mb-3" name="city" value="{{customer.city or ''}}"><button class="btn btn-primary">Save</button></form>{% endblock %}
