{% extends 'base.html' %}{% block content %}<h1>Customers</h1><form class="row g-2 mb-3" method="get"><div class="col"><input class="form-control" name="q" value="{{term}}" placeholder="Search name or email"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button></div></form><form class="row g-2 card card-body mb-3" method="post"><div class="col"><input class="form-control" name="full_name" placeholder="Full name" required></div><div class="col"><input class="form-control" name="email" type="email" placeholder="Email" required></div><div class="col"><input class="form-control" name="phone" placeholder="Phone"></div><div class="col"><input class="form-control" name="city" placeholder="City"></div><div class="col-auto"><button class="btn btn-primary">Add</button></div></form><div class="table-responsive"><table class="table bg-white"><tr><th>Name</th><th>Email</th><th>City</th><th></th></tr>{% for c in customers %}<tr><td>{{c.full_name}}</td><td>{{c.email}}</td><td>{{c.city}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('customers.edit',customer_id=c.customer_id)}}">Edit</a> <form class="d-inline" method="post" action="{{url_for('customers.delete',customer_id=c.customer_id)}}" onsubmit="return confirm('Delete customer?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4">No customers found.</td></tr>{% endfor %}</table></div>{% endblock %}
